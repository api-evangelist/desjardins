sources:
  - url: https://www.desjardins.com/
    type: Website
    note: Public corporate site, HTTP 200. Marketing, member tools, legal/privacy only — no developer/API surface.
  - url: https://developer.desjardins.com/
    type: DeveloperPortalProbe
    note: Does not resolve (HTTP 000). No first-party developer portal at the conventional subdomain.
  - url: https://api.desjardins.com/
    type: APIHostProbe
    note: Resolves via Akamai edge but returns HTTP 404; internal application backend, not a documented API.
  - url: https://www.openbankingtracker.com/provider/desjardins
    type: ThirdPartyResearch
    note: Lists no first-party Desjardins API; access via aggregators Flinks, Plaid, BankSync/Tink.
  - url: https://plaid.com/institutions/desjardins/
    type: ThirdPartyResearch
    note: Confirms Desjardins reachable through Plaid (Assets, Auth, Balance) via aggregator connectivity.
  - url: https://www.canada.ca/en/department-finance/programs/financial-sector-policy/open-banking-implementation/budget-2025-canadas-framework-for-consumer-driven-banking.html
    type: RegulatoryReference
    note: Canada's Consumer-Driven Banking framework — legislated, not yet operational; Big Six mandated, cooperatives may opt in.
actions:
  apisYmlUpdated: true
  reason: |
    Identity-only (built-stub) record. Desjardins exposes no public first-party
    API and no downloadable spec, so apis[] is empty; the honest open-finance
    reality (aggregator-only access plus optional, not-yet-live participation in
    Canada's Consumer-Driven Banking framework) is captured in the description
    and in this review. No OpenAPI was harvested because none is published.
