aid: desjardins
name: Desjardins Group
review:
  question: Does Desjardins Group expose a first-party public developer API portal or downloadable API specification?
  answer: false
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    Desjardins Group, the largest cooperative financial group in North America
    (a federation of caisses populaires / member-owned credit unions, regulated
    in Quebec by the Autorité des marchés financiers), publishes NO first-party
    public developer portal and NO downloadable OpenAPI/Swagger specification.
    Probing common portal patterns returned no live developer surface:
    developer.desjardins.com, developers.desjardins.com, apis.desjardins.com and
    apianddata.desjardins.com do not resolve (connection/DNS failure, HTTP 000);
    api.desjardins.com resolves through Akamai but returns HTTP 404 and is an
    internal application backend, not a documented API. The public site
    www.desjardins.com returns HTTP 200 but exposes only marketing, member
    tools and legal/privacy content — no API reference, no spec, no onboarding.

    Access to Desjardins account data today is AGGREGATOR-BASED, not first-party:
    Open Banking Tracker and aggregator coverage pages list Desjardins as reachable
    via Flinks (a Canadian aggregator), Plaid, Finicity and Tink using
    aggregator/screen-scraping connectivity. No first-party Desjardins API product
    is listed anywhere.

    Regulatory posture: Canada's Consumer-Driven Banking framework (the national
    open-banking regime, legislated in Budget 2024/2025 and overseen by the
    Financial Consumer Agency of Canada, FCAC) is legislated but NOT yet
    operational. The Big Six banks must support Phase 1; as a cooperative outside
    the Big Six, Desjardins may OPT IN rather than being mandated. No FDX
    participation is documented, and there is no US Section 1033 posture (this is
    the Canadian cooperative entity). No public authentication model (OAuth2/OIDC,
    API key, or mTLS) is documented because no public API is offered.
  posture:
